name: Windows terminal validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/web-ui/package-lock.json
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Warm Gradle wrapper with network retry
        shell: pwsh
        run: |
          $exitCode = 1
          foreach ($attempt in 1..3) {
            ./gradlew.bat --version
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Install Chromium for browser end-to-end tests
        shell: pwsh
        working-directory: terminal/web-ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Build browser end-to-end backend and Fabric artifact
        shell: pwsh
        run: >-
          ./gradlew.bat webBuild :terminal:terminal-app:installDist
          :runtime:runtime-app:installDist build-fabric-1.21.1 --stacktrace
      - name: Enforce real Windows symlink and junction boundaries
        shell: pwsh
        env:
          MCAC_REQUIRE_WINDOWS_LINK_TESTS: '1'
        run: >-
          ./gradlew.bat :runtime:runtime-app:test
          --tests com.mccompanion.runtime.workspace.AgentWorkspaceTest
          :compatibility:compatibility-host:test
          --tests com.mccompanion.compat.CompatibilityStoreLinkSecurityTest
          :terminal:installer:test
          --tests com.mccompanion.terminal.install.InstallTransactionTest
          --rerun-tasks --stacktrace
      - name: Run the full browser product path
        shell: pwsh
        working-directory: terminal/web-ui
        env:
          MCAC_E2E_PREBUILT: '1'
        run: npm run e2e
      - name: Build and execute clean HTML terminal package
        shell: pwsh
        run: >-
          ./gradlew.bat verifyTerminalPackage tuiIntegrationTest rootLauncherTest
          releaseStarterTest htmlTerminalStartTest runtimeMultiProfileTest
          runtimeDisabledLaunchTest releaseGoldenPathTest --stacktrace
      - name: Probe shared release gates with Gradle 9
        shell: pwsh
        run: ./gradlew.bat gradle9CompatibilityProbe --stacktrace
      - name: Upload verified RC candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcac-rc-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/distributions/mcac-release.zip
            build/distributions/mcac-release.zip.sha256
            build/distributions/mcac-release/release-manifest.json
            build/distributions/mcac-release/sbom.spdx.json
            build/distributions/mcac-release/SHA256SUMS.txt
      - name: Upload safe reports and launch logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-terminal-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/
            **/build/test-results/
            minecraft/*/build/launch-test/server/logs/
            build/reports/problems/
