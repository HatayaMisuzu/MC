name: Layer 2 of 3 - ready PR Windows integration

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/windows-full.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'core/**'
      - 'protocol/**'
      - 'runtime/**'
      - 'terminal/**'
      - 'compatibility/**'
      - 'minecraft/**'
      - 'tools/terminal-entrypoint-test.ps1'
      - 'tools/html-terminal-start-test.ps1'
      - 'tools/release-golden-path.ps1'
      - 'tools/verify-terminal-package.ps1'
      - 'tools/release-documentation-check.ps1'
      - 'tools/windows-final-artifact-test.ps1'
      - 'mcac.cmd'
      - 'mcac.ps1'
      - '启动终端.cmd'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

concurrency:
  group: layer-2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-integration:
    name: windows-integration
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/web-ui/package-lock.json
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Install Chromium
        timeout-minutes: 10
        shell: pwsh
        working-directory: terminal/web-ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Build the integration surface
        timeout-minutes: 15
        shell: pwsh
        run: >-
          ./gradlew.bat webBuild :terminal:terminal-app:installDist
          :runtime:runtime-app:installDist build-fabric-1.21.1
          --no-daemon --no-parallel --stacktrace

      - name: Verify Windows link and installer boundaries
        timeout-minutes: 10
        shell: pwsh
        env:
          MCAC_REQUIRE_WINDOWS_LINK_TESTS: '1'
        run: >-
          ./gradlew.bat :runtime:runtime-app:test
          --tests com.mccompanion.runtime.workspace.AgentWorkspaceTest
          :compatibility:compatibility-host:test
          --tests com.mccompanion.compat.CompatibilityStoreLinkSecurityTest
          :terminal:installer:test
          --tests com.mccompanion.terminal.install.InstallTransactionTest
          --rerun-tasks --no-daemon --no-parallel --stacktrace

      - name: Run the browser product path
        timeout-minutes: 10
        shell: pwsh
        working-directory: terminal/web-ui
        env:
          MCAC_E2E_PREBUILT: '1'
        run: npm run e2e

      - name: Verify package, launchers and clean extraction
        timeout-minutes: 25
        shell: pwsh
        run: >-
          ./gradlew.bat verifyTerminalPackage
          tuiIntegrationTest rootLauncherTest releaseStarterTest
          htmlTerminalStartTest windowsFinalArtifactTest releaseGoldenPathTest
          --no-daemon --no-parallel --stacktrace

      - name: Upload focused failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layer-2-windows-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/
            **/build/test-results/
            minecraft/*/build/launch-test/server/logs/
            build/release-golden-path/
            build/reports/problems/
