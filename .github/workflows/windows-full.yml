name: Layer 2 of 3 - ready PR Windows integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/windows-full.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'core/**'
      - 'protocol/**'
      - 'runtime/**'
      - 'terminal/**'
      - 'compatibility/**'
      - 'minecraft/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'KNOWN_LIMITATIONS.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'mcac.cmd'
      - 'mcac.ps1'
      - '启动终端.cmd'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

concurrency:
  group: layer-2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-integration:
    name: windows-integration
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/web-ui/package-lock.json
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Chromium
        timeout-minutes: 10
        shell: pwsh
        working-directory: terminal/web-ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Build the integration surface
        timeout-minutes: 15
        shell: pwsh
        run: >-
          ./gradlew.bat webBuild :terminal:terminal-app:installDist
          :runtime:runtime-app:installDist build-fabric-1.21.1
          --no-daemon --no-parallel --stacktrace

      - name: Verify Windows link and installer boundaries
        timeout-minutes: 10
        shell: pwsh
        env:
          MCAC_REQUIRE_WINDOWS_LINK_TESTS: '1'
        run: >-
          ./gradlew.bat :runtime:runtime-app:test
          --tests com.mccompanion.runtime.workspace.AgentWorkspaceTest
          :compatibility:compatibility-host:test
          --tests com.mccompanion.compat.CompatibilityStoreLinkSecurityTest
          :terminal:installer:test
          --tests com.mccompanion.terminal.install.InstallTransactionTest
          --rerun-tasks --no-daemon --no-parallel --stacktrace

      - name: Run the browser product path
        timeout-minutes: 10
        shell: pwsh
        working-directory: terminal/web-ui
        env:
          MCAC_E2E_PREBUILT: '1'
        run: npm run e2e

      - name: Verify package, launchers and clean extraction
        timeout-minutes: 25
        shell: pwsh
        run: >-
          ./gradlew.bat verifyTerminalPackage
          tuiIntegrationTest rootLauncherTest releaseStarterTest
          htmlTerminalStartTest windowsFinalArtifactTest releaseGoldenPathTest
          --no-daemon --no-parallel --stacktrace

      - name: Upload focused failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-2-windows-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/tests/
            **/build/test-results/
            minecraft/*/build/launch-test/server/logs/
            build/release-golden-path/
            build/reports/problems/
