def powershellExecutable = System.getProperty('os.name').toLowerCase().contains('windows')
        ? 'powershell' : 'pwsh'
def isWindowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
def runProcess = { Closure configuration ->
    def execution = providers.exec(configuration)
    def result = execution.result.get()
    def stdout = execution.standardOutput.asText.get()
    def stderr = execution.standardError.asText.get()
    if (!stdout.isBlank()) logger.lifecycle(stdout.stripTrailing())
    if (!stderr.isBlank()) logger.error(stderr.stripTrailing())
    result.assertNormalExitValue()
}
def runProcessOutput = { Closure configuration ->
    def execution = providers.exec(configuration)
    execution.result.get().assertNormalExitValue()
    execution.standardOutput.asText.get()
}

