def terminalImage = layout.buildDirectory.dir('distributions/mcac-release')
def terminalInput = layout.buildDirectory.dir('tmp/jpackage-terminal-input')
def terminalJpackage = layout.buildDirectory.dir('tmp/jpackage-terminal-output')

def npmCommand = isWindowsHost ? 'npm.cmd' : 'npm'

tasks.register('webInstall', Exec) {
    group = 'build'
    workingDir file('terminal/web-ui')
    commandLine npmCommand, 'ci', '--no-audit', '--no-fund'
    inputs.files 'terminal/web-ui/package.json', 'terminal/web-ui/package-lock.json'
    outputs.dir 'terminal/web-ui/node_modules'
}

tasks.register('webTest', Exec) {
    group = 'verification'
    dependsOn 'webInstall'
    workingDir file('terminal/web-ui')
    commandLine npmCommand, 'test'
}

tasks.register('webBuild', Exec) {
    group = 'build'
    dependsOn 'webInstall'
    workingDir file('terminal/web-ui')
    commandLine npmCommand, 'run', 'build'
    inputs.dir 'terminal/web-ui/src'
    inputs.files 'terminal/web-ui/index.html', 'terminal/web-ui/vite.config.ts', 'terminal/web-ui/tsconfig.json', 'terminal/web-ui/tsconfig.app.json'
    outputs.dir 'terminal/web-ui/dist'
}

tasks.register('cleanTerminalPackage', Delete) {
    delete terminalImage, terminalInput, terminalJpackage
}

tasks.register('prepareTerminalPackageInput', Copy) {
    dependsOn 'cleanTerminalPackage', ':terminal:terminal-app:installDist', ':runtime:runtime-app:installDist'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('terminal/terminal-app/build/install/mcac/lib')
    from('runtime/runtime-app/build/install/runtime-app/lib')
    into terminalInput
}

tasks.register('jpackageTerminal', Exec) {
    group = 'distribution'
    dependsOn 'prepareTerminalPackageInput'
    doFirst {
        def toolchains = project(':terminal:terminal-app').extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
        def java21 = toolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        def jpackage = java21.get().metadata.installationPath.file('bin/jpackage.exe').asFile
        commandLine jpackage, '--type', 'app-image', '--name', 'mcac',
                '--input', terminalInput.get().asFile,
                '--main-jar', "terminal-app-${project.version}.jar",
                '--main-class', 'com.mccompanion.terminal.ControlTerminalMain',
                '--dest', terminalJpackage.get().asFile,
                '--add-launcher', "runtime-app=${file('tools/runtime-launcher.properties').absolutePath}",
                '--add-launcher', "mcac-cli=${file('tools/mcac-cli-launcher.properties').absolutePath}",
                '--java-options', '-Dfile.encoding=UTF-8'
    }
}

tasks.register('stageTerminal') {
    group = 'distribution'
    dependsOn 'jpackageTerminal', ':runtime:runtime-app:installDist', 'buildPlatforms', 'webBuild'
    doLast {
        copy {
            into terminalImage
            from(terminalJpackage.map { it.dir('mcac') })
            from('mcac.cmd')
            from('mcac.ps1')
            from('tools/runtime-app-bundled.cmd')
            from('terminal/web-ui/dist') { into 'web' }
            from('启动终端.cmd')
            from('minecraft/fabric-1.21.1/build/libs') { into 'artifacts/fabric-1.21.1'; include '*.jar'; exclude '*sources*', '*gametest*' }
            from('minecraft/neoforge-1.21.1/build/libs') { into 'artifacts/neoforge-1.21.1'; include '*.jar'; exclude '*sources*' }
            from('minecraft/forge-1.20.1/build/libs') { into 'artifacts/forge-1.20.1'; include '*.jar'; exclude '*sources*' }
            from('README.md') { rename { 'README.txt' } }
            from('KNOWN_LIMITATIONS.md')
            from('CODEX_EXECUTION.md')
            from('docs/INDEX.md') { into 'docs' }
            from('docs/PRODUCT_STATUS.md') { into 'docs' }
            from('docs/product/PRODUCT_TRUTH.json') { into 'docs/product' }
            from('docs/product/BRAIN_ADAPTER_CAPABILITIES.json') { into 'docs/product' }
            from('docs/product/BUILTIN_SKILL_SCOPE.md') { into 'docs/product' }
            from('docs/ARCHITECTURE.md') { into 'docs' }
            from('docs/COMPATIBILITY.md') { into 'docs' }
            from('docs/CONTROL_TERMINAL.md') { into 'docs' }
            from('docs/MCP_PROTOCOL.md') { into 'docs' }
            from('docs/TASK_GRAPH_DSL.md') { into 'docs' }
            from('docs/RC_COMPLETION_MATRIX.md') { into 'docs' }
            from('docs/LIVE_BRAIN_HUMAN_PLAYTEST.md') { into 'docs' }
            from('docs/POST_PRODUCTIZATION_P0.md') { into 'docs' }
            from('docs/user') { into 'docs/user' }
            from('docs/developer') { into 'docs/developer' }
            from('docs/compatibility') { into 'docs/compatibility' }
            from('LICENSE') { into 'legal' }
            from('NOTICE') { into 'legal' }
        }
        def root=terminalImage.get().asFile
        def sha256={f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
        def relative={f->root.toPath().relativize(f.toPath()).toString().replace('\\','/')}
        def sourceCommit=runProcessOutput { commandLine 'git','rev-parse','HEAD' }.trim()
        def sourceTimestamp=java.time.OffsetDateTime.parse(
                runProcessOutput { commandLine 'git','show','-s','--format=%cI',sourceCommit }.trim())
                .toInstant().toString()
        def payload=fileTree(root).matching { include '**/*'; exclude 'SHA256SUMS.txt','release-manifest.json','sbom.spdx.json' }
                .files.findAll { it.isFile() }.sort { relative(it) }
        def manifest=[schemaVersion:1,product:'Minecraft AI Companion',version:project.version.toString(),
                buildType:'RC_CANDIDATE',sourceCommit:sourceCommit,
                files:payload.collect{f->[path:relative(f),size:f.length(),sha256:sha256(f)]}]
        file("${root}/release-manifest.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest))+'\n','UTF-8')
        def licenseByCoordinate=[
                'org.java-websocket:Java-WebSocket':'Apache-2.0',
                'com.fasterxml.jackson.core:jackson-annotations':'Apache-2.0',
                'com.fasterxml.jackson.core:jackson-core':'Apache-2.0',
                'com.fasterxml.jackson.core:jackson-databind':'Apache-2.0',
                'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml':'Apache-2.0',
                'com.fasterxml.jackson.datatype:jackson-datatype-jsr310':'Apache-2.0',
                'org.jsoup:jsoup':'MIT',
                'org.slf4j:slf4j-api':'MIT',
                'org.slf4j:slf4j-simple':'MIT',
                'org.yaml:snakeyaml':'Apache-2.0',
                'org.xerial:sqlite-jdbc':'Apache-2.0'
        ]
        def inspectJar={f->
            def path=relative(f)
            def jar=new java.util.jar.JarFile(f)
            try {
                def propertyEntries=jar.entries().findAll {
                    !it.directory && it.name ==~ /META-INF\/maven\/[^\/]+\/[^\/]+\/pom\.properties/
                }.toList()
                if(propertyEntries.size()>1) throw new GradleException("Ambiguous Maven identity in ${path}")
                if(propertyEntries.size()==1) {
                    def properties=new Properties()
                    jar.getInputStream(propertyEntries[0]).withCloseable { properties.load(it) }
                    def groupId=properties.getProperty('groupId')
                    def artifactId=properties.getProperty('artifactId')
                    def dependencyVersion=properties.getProperty('version')
                    def coordinate="${groupId}:${artifactId}"
                    def declaredLicense=licenseByCoordinate[coordinate]
                    if(!groupId||!artifactId||!dependencyVersion||!declaredLicense) {
                        throw new GradleException("Incomplete Maven SBOM metadata for ${path}: ${coordinate}:${dependencyVersion}")
                    }
                    def repositoryPath=groupId.replace('.','/')
                    return [name:artifactId,version:dependencyVersion,license:declaredLicense,
                            download:"https://repo1.maven.org/maven2/${repositoryPath}/${artifactId}/${dependencyVersion}/${artifactId}-${dependencyVersion}.jar",
                            supplier:"Organization: ${groupId}",
                            purl:"pkg:maven/${groupId}/${artifactId}@${dependencyVersion}"]
                }
                def jarManifest=jar.manifest?.mainAttributes
                def implementationVersion=jarManifest?.getValue('Implementation-Version')
                def bundleVersion=jarManifest?.getValue('Bundle-Version')
                if(f.name ==~ /picocli-[0-9].*\.jar/) {
                    def dependencyVersion=implementationVersion ?: bundleVersion
                    return [name:'picocli',version:dependencyVersion,license:'Apache-2.0',
                            download:"https://repo1.maven.org/maven2/info/picocli/picocli/${dependencyVersion}/picocli-${dependencyVersion}.jar",
                            supplier:'Organization: info.picocli',
                            purl:"pkg:maven/info.picocli/picocli@${dependencyVersion}"]
                }
                if(path=='runtime/lib/jrt-fs.jar') {
                    def dependencyVersion=implementationVersion
                    if(!dependencyVersion) throw new GradleException('jrt-fs.jar has no Implementation-Version')
                    return [name:'OpenJDK jrt-fs',version:dependencyVersion,
                            license:'GPL-2.0-with-classpath-exception',download:'NOASSERTION',
                            supplier:'Organization: Eclipse Adoptium',
                            purl:"pkg:generic/openjdk-jrt-fs@${dependencyVersion}"]
                }
                if(f.name.endsWith("-${project.version}.jar")) {
                    return [name:f.name[0..<-4],version:project.version.toString(),
                            license:'LicenseRef-MCAC-Evaluation',download:'NOASSERTION',
                            supplier:'Organization: HatayaMisuzu/MC',
                            purl:"pkg:github/HatayaMisuzu/MC@${sourceCommit}"]
                }
                throw new GradleException("Unable to identify packaged JAR for SBOM: ${path}")
            } finally {
                jar.close()
            }
        }
        def jarPackages=payload.findAll{f->f.name.endsWith('.jar')}.withIndex().collect{f,index->
            def identity=inspectJar(f)
            [
                SPDXID:"SPDXRef-Package-${index+1}",name:identity.name,versionInfo:identity.version,
                downloadLocation:identity.download,filesAnalyzed:false,licenseConcluded:'NOASSERTION',
                licenseDeclared:identity.license,copyrightText:'NOASSERTION',supplier:identity.supplier,
                packageFileName:relative(f),primaryPackagePurpose:'LIBRARY',
                checksums:[[algorithm:'SHA256',checksumValue:sha256(f)]],
                externalRefs:[[referenceCategory:'PACKAGE-MANAGER',referenceType:'purl',
                               referenceLocator:identity.purl]]
            ]
        }
        def npmLock=new JsonSlurper().parse(file('terminal/web-ui/package-lock.json'))
        def npmEntries=npmLock.packages.findAll { path, metadata ->
            path.startsWith('node_modules/') && !metadata.dev && !metadata.link
        }.entrySet().toList().sort { left, right -> left.key <=> right.key }
        def npmPackages=npmEntries.withIndex().collect { entry, index ->
            def npmName=entry.key.substring('node_modules/'.length())
            def metadata=entry.value
            if(!metadata.version || !metadata.license || !metadata.resolved ||
                    !(metadata.integrity instanceof String) || !metadata.integrity.startsWith('sha512-')) {
                throw new GradleException("Incomplete production npm SBOM metadata for ${npmName}")
            }
            def checksum=Base64.decoder.decode(metadata.integrity.substring('sha512-'.length()))
                    .encodeHex().toString()
            def purlName=npmName.startsWith('@') ? "%40${npmName.substring(1)}" : npmName
            [
                SPDXID:"SPDXRef-NpmPackage-${index+1}",name:npmName,versionInfo:metadata.version,
                downloadLocation:metadata.resolved,filesAnalyzed:false,licenseConcluded:'NOASSERTION',
                licenseDeclared:metadata.license,copyrightText:'NOASSERTION',
                supplier:'NOASSERTION',primaryPackagePurpose:'LIBRARY',
                sourceInfo:'Resolved by terminal/web-ui/package-lock.json and bundled into the Web terminal assets.',
                checksums:[[algorithm:'SHA512',checksumValue:checksum]],
                externalRefs:[[referenceCategory:'PACKAGE-MANAGER',referenceType:'purl',
                               referenceLocator:"pkg:npm/${purlName}@${metadata.version}"]]
            ]
        }
        def packages=jarPackages+npmPackages
        def sbom=[spdxVersion:'SPDX-2.3',dataLicense:'CC0-1.0',SPDXID:'SPDXRef-DOCUMENT',
                name:"mcac-${project.version}",documentNamespace:"https://github.com/HatayaMisuzu/MC/spdx/${sourceCommit}",
                creationInfo:[created:sourceTimestamp,creators:['Organization: HatayaMisuzu/MC']],
                packages:packages,documentDescribes:packages.collect{it.SPDXID},
                extractedLicensingInfo:[[
                    licenseId:'LicenseRef-MCAC-Evaluation',
                    extractedText:file('LICENSE').getText('UTF-8'),
                    name:'MCAC evaluation license'
                ]]]
        file("${root}/sbom.spdx.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(sbom))+'\n','UTF-8')
        def files=fileTree(root).matching { include '**/*'; exclude 'SHA256SUMS.txt' }.files.findAll { it.isFile() }.sort { it.absolutePath }
        file("${root}/SHA256SUMS.txt").withWriter('UTF-8'){w->files.each{f->w.write("${sha256(f)}  ${relative(f)}\n")}}
    }
}

tasks.register('stageTerminalAtProjectRoot', Copy) { dependsOn 'stageTerminal'; from terminalImage; into 'mcac-local' }
tasks.register('packageTerminal') { group='distribution'; dependsOn 'stageTerminal' }

tasks.register('packageTerminalZip', Zip) {
    group = 'distribution'
    dependsOn 'packageTerminal'
    archiveFileName = 'mcac-release.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(terminalImage)
    outputs.file(layout.buildDirectory.file('distributions/mcac-release.zip.sha256'))
    doLast {
        def archive=archiveFile.get().asFile
        def digest=java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        layout.buildDirectory.file('distributions/mcac-release.zip.sha256').get().asFile
                .setText("${digest}  mcac-release.zip\n",'UTF-8')
    }
}

