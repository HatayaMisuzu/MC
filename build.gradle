tasks.register('dependencyPinningCheck') {
    group = 'verification'
    description = 'Rejects dynamic top-level dependencies and mutable GitHub Action references.'
    doLast {
        def verificationFiles = [
                'gradle/verification-metadata.xml',
                'minecraft/fabric-1.21.1/gradle/verification-metadata.xml',
                'minecraft/forge-1.20.1/gradle/verification-metadata.xml',
                'minecraft/neoforge-1.21.1/gradle/verification-metadata.xml'
        ]
        verificationFiles.each { relative ->
            if (!file(relative).isFile()) {
                throw new GradleException("Missing dependency verification metadata: ${relative}")
            }
        }
        def lockFiles = [
                'compatibility/compatibility-host/gradle.lockfile',
                'core/pure-core/gradle.lockfile',
                'protocol/protocol-model/gradle.lockfile',
                'runtime/runtime-app/gradle.lockfile',
                'terminal/diagnostics/gradle.lockfile',
                'terminal/installer/gradle.lockfile',
                'terminal/instance-probe/gradle.lockfile',
                'terminal/launcher-api/gradle.lockfile',
                'terminal/launcher-generic/gradle.lockfile',
                'terminal/launcher-hmcl/gradle.lockfile',
                'terminal/launcher-pcl2/gradle.lockfile',
                'terminal/runtime-supervisor/gradle.lockfile',
                'terminal/terminal-app/gradle.lockfile',
                'minecraft/fabric-1.21.1/gradle.lockfile',
                'minecraft/forge-1.20.1/gradle.lockfile',
                'minecraft/neoforge-1.21.1/gradle.lockfile'
        ]
        lockFiles.each { relative ->
            if (!file(relative).isFile()) {
                throw new GradleException("Missing dependency lock state: ${relative}")
            }
        }
        [
                'gradle/wrapper/gradle-wrapper.properties',
                'minecraft/fabric-1.21.1/gradle/wrapper/gradle-wrapper.properties',
                'minecraft/forge-1.20.1/gradle/wrapper/gradle-wrapper.properties',
                'minecraft/neoforge-1.21.1/gradle/wrapper/gradle-wrapper.properties'
        ].each { relative ->
            if (!(file(relative).getText('UTF-8') =~ /(?m)^distributionSha256Sum=[a-f0-9]{64}$/)) {
                throw new GradleException("Gradle wrapper lacks a pinned distribution SHA-256: ${relative}")
            }
        }
        def packageFile=file('terminal/web-ui/package.json')
        def lockFile=file('terminal/web-ui/package-lock.json')
        def packageJson=new JsonSlurper().parse(packageFile)
        def lockJson=new JsonSlurper().parse(lockFile)
        ['dependencies','devDependencies'].each { section ->
            (packageJson[section] ?: [:]).each { name, declared ->
                if(!(declared ==~ /[0-9]+(?:\.[0-9]+){1,3}(?:-[0-9A-Za-z.-]+)?/)) {
                    throw new GradleException("Unpinned npm ${section} entry: ${name}=${declared}")
                }
                if(lockJson.packages[''][section][name] != declared) {
                    throw new GradleException("package-lock root mismatch: ${name}")
                }
                if(lockJson.packages["node_modules/${name}"]?.version != declared) {
                    throw new GradleException("package-lock resolved version mismatch: ${name}")
                }
            }
        }
        fileTree(projectDir) {
            include '**/*.gradle', '**/gradle.properties'
            exclude '**/build/**', '.gradle/**'
        }.files.each { dependencyFile ->
            def text=dependencyFile.getText('UTF-8')
            if(text =~ /(?i)(?:version\s*=\s*|version\s+['"])[^'"\r\n]*SNAPSHOT/) {
                throw new GradleException("Snapshot production dependency: ${projectDir.toPath().relativize(dependencyFile.toPath())}")
            }
            if(text =~ /(?m)^\s*[^#\r\n]*(?:version|dependency)[^=\r\n]*=\s*[+*]\s*$/) {
                throw new GradleException("Dynamic production dependency: ${projectDir.toPath().relativize(dependencyFile.toPath())}")
            }
        }
        fileTree('.github/workflows') { include '*.yml','*.yaml' }.files.each { workflow ->
            workflow.readLines('UTF-8').each { line ->
                def matcher=(line =~ /^\s*uses:\s+[^@\s]+@([^\s#]+)/)
                if(matcher.find() && !(matcher.group(1) ==~ /[0-9a-f]{40}/)) {
                    throw new GradleException("Mutable GitHub Action reference in ${workflow.name}: ${line.trim()}")
                }
            }
        }
        println 'Dependency pinning check passed: npm roots, Gradle locks/verification/wrappers, and Actions are immutable.'
    }
}

