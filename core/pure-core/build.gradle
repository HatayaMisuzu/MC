plugins { id 'java-library' }

sourceSets.main.java.srcDir('../../minecraft/navigation-common/src/main/java')
sourceSets.main.java.srcDir('../../minecraft/body-common/src/main/java')
sourceSets.test.java.srcDir('../../minecraft/bridge-common/src/main/java')

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation project(':protocol:protocol-api')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'com.google.code.gson:gson:2.10'
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

// Compile the actual two codecs against the shared contract, without a Minecraft/Loader classpath.
tasks.named('compileTestJava') {
    source '../../minecraft/fabric-1.21.1/src/main/java/com/mccompanion/minecraft/fabric/JacksonBridgeCodec.java'
    source '../../minecraft/forge-1.20.1/src/main/java/com/mccompanion/minecraft/forge/GsonBridgeCodec.java'
}
