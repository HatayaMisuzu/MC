plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "minecraft-ai-companion-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDir('../platform-bootstrap-common/src/main/java')
sourceSets.main.java.srcDir('../bridge-common/src/main/java')
sourceSets.main.java.srcDir('../platform-1.20.1-common/src/main/java')
sourceSets.main.java.srcDir('../navigation-common/src/main/java')
sourceSets.main.java.srcDir('../body-common/src/main/java')
sourceSets.main.resources.srcDir('../platform-common/src/main/resources')
sourceSets.main.resources.srcDir('src/generated/resources')
sourceSets {
    gameTestMod {
        java.setSrcDirs(['src/gametestmod/java'])
        resources.setSrcDirs(['src/gametestmod/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.register('resolveAndLockAll') {
    doLast {
        configurations.matching { it.canBeResolved }.each { it.resolve() }
    }
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    addModdingDependenciesTo sourceSets.gameTestMod

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        server {
            server()
            gameDirectory = project.file('build/launch-test/server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'mccompanion.persistence.probe',
                    "${project.findProperty('mccompanionPersistenceProbe') ?: ''}"
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
            systemProperty 'mccompanion.runtime.e2e',
                    "${project.findProperty('mccompanionRuntimeE2E') ?: 'false'}"
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        mcac_unknown_fixture {
            sourceSet(sourceSets.gameTestMod)
        }
    }
}

dependencies {
    implementation "com.mccompanion:pure-core:${mod_version}"
    implementation "com.mccompanion:protocol-model:${mod_version}"
    gameTestModImplementation sourceSets.main.output
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.mod_name,
                'Implementation-Version': project.version,
                'Minecraft-Version': project.minecraft_version,
                'Mod-Loader': 'Forge'
        )
    }
}

def verifyRuntimeBridgeArtifact = tasks.register('verifyRuntimeBridgeArtifact') {
    group = 'verification'
    description = 'Fails if Loader-neutral Runtime Bridge classes are absent from the production JAR.'
    dependsOn tasks.named('jar')
    doLast {
        File artifact = tasks.named('jar').get().archiveFile.get().asFile
        Set<String> required = [
                'com/mccompanion/minecraft/forge/RuntimeBridge.class',
                'com/mccompanion/minecraft/bridge/ConversationDeliveryWindow.class',
                'com/mccompanion/minecraft/bridge/ConnectionEpochGate.class',
                'com/mccompanion/minecraft/forge/json/ObjectMapper.class',
                'com/mccompanion/core/body/BodyControlArbiter.class',
                'pack.mcmeta'
        ]
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            required.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Production Forge JAR is missing ${entry}: ${artifact}")
                }
            }
            def packMetadata = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry('pack.mcmeta')))
            if (packMetadata?.pack?.pack_format != 15 || !packMetadata?.pack?.description) {
                throw new GradleException("Production Forge JAR has invalid 1.20.1 pack.mcmeta: ${artifact}")
            }
            zip.entries().each { entry ->
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.toLowerCase().contains('jackson')) {
                    throw new GradleException("Production Forge JAR still embeds Jackson: ${entry.name}")
                }
                if (entry.name.endsWith('.class')) {
                    String constants = new String(zip.getInputStream(entry).readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains('com/fasterxml/jackson')) {
                        throw new GradleException("Production Forge class references Jackson: ${entry.name}")
                    }
                }
            }
        }
    }
}
tasks.named('check').configure { dependsOn verifyRuntimeBridgeArtifact }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

apply from: rootProject.file('../gradle/launch-test.gradle')

tasks.named('runGameTestServer').configure {
    doFirst {
        if (!project.hasProperty('mccompanionRuntimeE2E')) {
            delete file('build/gametest')
        }
        file('build/gametest').mkdirs()
        file('build/gametest/server.properties').setText(
                'online-mode=false\nlevel-name=world\nspawn-protection=0\n', 'UTF-8')
        file('build/gametest/eula.txt').setText('eula=true\n', 'UTF-8')
    }
}
